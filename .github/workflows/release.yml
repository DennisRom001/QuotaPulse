# Builds, signs and publishes a QuotaPulse release when a version tag is pushed.
#
#   git tag v1.5.0 && git push origin v1.5.0
#
# The tag must match "version" in src-tauri/tauri.conf.json (and package.json /
# Cargo.toml). Three jobs, all free on public repositories:
#
#   1. create-release  — a *draft* release for the tag (invisible to the
#                        updater while assets are still uploading);
#   2. build           — Windows (.exe NSIS + .msi), macOS (universal .app +
#                        .dmg, ad-hoc signed, not notarized) and Linux
#                        (.AppImage + .deb). Each job signs its update bundle
#                        with the updater key and merges its platform into the
#                        release's latest.json;
#   3. publish         — marks the release public and "latest" only once every
#                        platform has uploaded, so latest.json is never partial.
#
# Installed copies of QuotaPulse then find the update at
# https://github.com/DennisRom001/QuotaPulse/releases/latest/download/latest.json
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (must not be empty)
#
# No Apple certificate is needed: without APPLE_* secrets the macOS build is
# ad-hoc signed ("signingIdentity": "-") and not notarized.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches the app version
        shell: pwsh
        run: |
          # tauri.conf.json is what the installed app reports and the updater
          # compares; package.json and Cargo.toml must say the same.
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = ((Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value)
          Write-Host "tag=${{ github.ref_name }} tauri.conf=$tauri package.json=$pkg Cargo.toml=$cargo"
          if ("v$tauri" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match tauri.conf.json version $tauri"
            exit 1
          }
          if ($pkg -ne $tauri -or $cargo -ne $tauri) {
            Write-Error "Versions differ: tauri.conf.json=$tauri package.json=$pkg Cargo.toml=$cargo"
            exit 1
          }

      - name: Check updater signing key is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            Write-Error "Secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD are required (see BUILDING.md)."
            exit 1
          }

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "QuotaPulse $TAG" \
            --notes "Installers for QuotaPulse $TAG on Windows, macOS and Linux. Existing installations update themselves (Settings → About → check for updates)."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --config src-tauri/tauri.release.conf.json
          - name: macos
            os: macos-latest
            args: --config src-tauri/tauri.release.conf.json --target universal-apple-darwin --bundles app,dmg
          - name: linux
            os: ubuntu-22.04
            args: --config src-tauri/tauri.release.conf.json --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev libssl-dev build-essential

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS ships one universal binary (Apple silicon + Intel).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies (includes the Tauri CLI)
        run: npm ci

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key must have a non-empty password: Windows cannot pass an empty
          # environment variable, and a password-less key then fails to decode.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          # tauri.release.conf.json turns on updater artifacts (signed bundles
          # + latest.json) for release builds only.
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false -F prerelease=false -f make_latest=true
