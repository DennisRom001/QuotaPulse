# Continuous integration for QuotaPulse (Windows-only desktop app).
# Builds the frontend and runs the Rust test suite. Installers are built
# and signed locally with `npm run tauri build` (see BUILDING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versions agree (package.json, tauri.conf.json, Cargo.toml)
        shell: pwsh
        run: |
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = ((Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value)
          Write-Host "tauri.conf=$tauri package.json=$pkg Cargo.toml=$cargo"
          if ($pkg -ne $tauri -or $cargo -ne $tauri) {
            Write-Error "Versions differ: tauri.conf.json=$tauri package.json=$pkg Cargo.toml=$cargo"
            exit 1
          }

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
